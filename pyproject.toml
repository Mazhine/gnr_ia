[project]
name = "maintidoc"
version = "0.1.0"
description = "Assistant documentaire multimodal et agentique pour la maintenance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
# Installe PyTorch avec le support CUDA. Index dédié, voir docs/adr/0001.
gpu = [
    "torch>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
# Les wheels PyTorch CUDA ne sont pas sur PyPI : index explicite.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maintidoc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Les scripts de génération de corpus écrivent des fichiers volumineux :
# on tolère les noms courts dans les boucles numériques.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
strict = true
warn_unused_ignores = true

# PyTorch n'expose pas de marqueur py.typed dans toutes ses distributions.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

# Bibliotheques de mise en page et de lecture PDF : pas de stubs publication
# stable. Les ignorer evite de parsemer le generateur de `# type: ignore` qui
# n'apporteraient aucune verification supplementaire.
[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*", "pymupdf", "PIL", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
